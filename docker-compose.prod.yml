# EC2에서 실행하는 운영용 구성
# - backend: Spring Boot (프로필: rabbitmq, DB는 RDS PostgreSQL)
# - rabbitmq: 브로커 (외부 노출하지 않고 내부 네트워크로만 사용)
# DB는 RDS를 사용하므로 이 파일에는 postgres 컨테이너가 없다.

services:
  backend:
    # ECR Public 에 푸시된 이미지를 그대로 받아 실행한다(EC2에서 빌드하지 않음).
    # 태그는 배포 시 BACKEND_IMAGE 로 주입한다(미지정 시 latest).
    image: ${BACKEND_IMAGE:-public.ecr.aws/i6n5a0h7/portfolio:latest}
    container_name: cj-logistics-backend
    restart: "on-failure:3"
    # t3.micro(1 GiB)에서 호스트 OS와 RabbitMQ 메모리를 침범하지 않도록 제한한다.
    mem_limit: 448m
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: rabbitmq
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx192m -XX:MaxMetaspaceSize=160m
        -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      # --- RDS PostgreSQL ---
      DB_URL: ${DB_URL}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 운영에서는 H2 콘솔 비활성화
      H2_CONSOLE_ENABLED: "false"
      # --- RabbitMQ (같은 compose 네트워크의 서비스명으로 연결) ---
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # --- 보안/CORS ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    networks:
      - cj-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cj-logistics-rabbitmq
    restart: "on-failure:3"
    mem_limit: 256m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # 포트를 호스트로 노출하지 않는다(내부 네트워크 전용).
    # 관리 UI가 필요하면 SSH 터널을 사용한다: ssh -L 15672:localhost:15672
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cj-net

networks:
  cj-net:
    driver: bridge

volumes:
  rabbitmq-data:
