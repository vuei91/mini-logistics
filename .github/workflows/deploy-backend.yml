name: Deploy Backend (ECR Public + EC2)

# app/ 또는 배포 구성 변경이 main 에 머지되면
# 1) 테스트/빌드로 이상 여부 확인
# 2) 이미지를 빌드해 ECR Public 에 push
# 3) SSH 로 EC2 에 접속해 해당 이미지를 pull 하여 재배포(EC2에서 빌드하지 않음)
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

# ECR Public 레지스트리 주소(계정 별칭 포함)
env:
  ECR_PUBLIC_REGISTRY: public.ecr.aws/i6n5a0h7
  ECR_REPOSITORY: portfolio

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & test
        run: ./gradlew --no-daemon clean build

  build-push:
    needs: build-test
    runs-on: ubuntu-latest
    # OIDC 로 AWS 자격증명을 발급받기 위해 필요
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # ECR Public 인증은 항상 us-east-1 에서 이뤄진다.
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set image URI (commit SHA tag)
        id: image
        run: echo "uri=${ECR_PUBLIC_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build -t "${{ steps.image.outputs.uri }}" -t "${ECR_PUBLIC_REGISTRY}/${ECR_REPOSITORY}:latest" ./app
          docker push "${{ steps.image.outputs.uri }}"
          docker push "${ECR_PUBLIC_REGISTRY}/${ECR_REPOSITORY}:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMAGE: ${{ needs.build-push.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_IMAGE
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            # compose 파일 등 최신화
            git pull --ff-only origin main
            # 이번 배포에 사용할 이미지 태그를 .env.prod 에 반영
            if grep -q '^BACKEND_IMAGE=' .env.prod; then
              sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=${BACKEND_IMAGE}#" .env.prod
            else
              echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env.prod
            fi
            # ECR Public 이미지를 받아 빌드 없이 실행
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f
