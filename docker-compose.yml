services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cj-logistics-rabbitmq
    ports:
      - "5672:5672"    # AMQP 프로토콜 포트 (애플리케이션 연결용)
      - "15672:15672"  # 관리 UI 포트 (http://localhost:15672, guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
